<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prayer Chain">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<title>AGC Prayer Chain</title>
<style>
:root{
  --navy:#14213d; --navy2:#1f3466; --gold:#c9972b; --gold-soft:#f6e7bd;
  --bg:#f7f3ea; --card:#ffffff; --ink:#1b2236; --muted:#5d6579; --line:#e3dccb;
  --ok:#2f7d5b; --okbg:#e6f3ec; --warn:#a4351f; --mine:#fff4d6; --mine-line:#e2bf62;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0e1424; --card:#172038; --ink:#eef0f6; --muted:#a3abc0; --line:#2a3558;
    --gold-soft:#3a3115; --ok:#5fcf9d; --okbg:#14352a; --mine:#3a3115; --mine-line:#8a6d22; --warn:#ff9b86; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari",Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
[lang=ne]{font-family:"Noto Sans Devanagari","Mukta","Nirmala UI","Kohinoor Devanagari",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto}
header{background:linear-gradient(160deg,var(--navy2),var(--navy));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;border-radius:12px;flex:none}
.brand .t{flex:1;min-width:0}
.brand .t .cols{color:#fff;border-color:rgba(255,255,255,.25);font-weight:700;font-size:1.05rem}
.brand .t .sub{font-size:.78rem;opacity:.8;margin-top:2px}
.months{display:flex;gap:8px;margin-top:12px}
.months button{flex:1;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:8px 6px;min-height:48px}
.months button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1b1500;font-weight:700}
main{padding:14px 14px 0}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.88rem}
.banner.demo{background:var(--gold-soft);color:var(--ink);border:1px dashed var(--mine-line)}
.banner.off{background:#fde8e4;color:#7a2514}
@media (prefers-color-scheme:dark){.banner.off{background:#3b1a14;color:#ffb4a4}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.bi{display:inline-flex;flex-direction:column;line-height:1.2;text-align:center}
.bi>span+span{font-size:.86em;opacity:.85}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
.cols>div:first-child{padding-right:10px}
.cols>div:last-child{padding-left:10px;border-left:1px solid var(--line)}
.h2{font-size:1.05rem;font-weight:700}
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e6c36a);border-radius:99px}
.muted{color:var(--muted);font-size:.86rem}
.row2{display:flex;justify-content:space-between;gap:8px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:10px 14px;min-height:48px;background:var(--navy);color:#fff;font-weight:600}
.btn.gold{background:var(--gold);color:#1b1500}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.btn.sm{min-height:44px;padding:6px 12px;font-size:.9rem}
.btn[disabled]{opacity:.5}
.btn.block{width:100%}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.day{flex:none;width:54px;min-height:70px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 2px;text-align:center;scroll-snap-align:center}
.day small{display:block;font-size:.68rem;color:var(--muted);line-height:1.1}
.day b{display:block;font-size:1.15rem;margin:2px 0}
.day i{display:block;height:5px;margin:3px 6px 0;border-radius:9px;background:var(--line);overflow:hidden}
.day i>u{display:block;height:100%;background:var(--gold);text-decoration:none}
.day[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.day[aria-pressed=true] small{color:#d7def0}
.day.today b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:9px;background:var(--gold);margin-left:3px;vertical-align:middle}
.slot{display:grid;grid-template-columns:118px 1fr auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px;min-height:56px}
.slot .tm{font-weight:700;font-size:.9rem;line-height:1.15}
.slot.open{border-color:var(--ok);background:var(--okbg)}
.slot.mine{background:var(--mine);border-color:var(--mine-line)}
.slot.past{opacity:.55}
.slot.now{box-shadow:0 0 0 2px var(--gold)}
.slot.flash{animation:flash 1.4s ease 1}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
.nm{font-weight:600;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:.68rem;padding:1px 7px;border-radius:99px;background:var(--gold);color:#1b1500;margin-left:6px;vertical-align:middle}
.tag.ok{background:var(--ok);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.req{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;overflow:hidden}
.req>div{padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.req>div+div{border-left:1px solid var(--line)}
.req .n{display:inline-block;min-width:22px;height:22px;border-radius:99px;background:var(--navy);color:#fff;text-align:center;font-size:.75rem;line-height:22px;margin-right:6px}
.req.ans{opacity:.8;border-style:dashed}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:48px}
textarea{min-height:92px;resize:vertical}
label.f{display:block;font-size:.8rem;color:var(--muted);margin:6px 0 4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 1px;min-height:62px;color:var(--muted);font-size:.72rem;display:flex;align-items:center;justify-content:center}
nav button[aria-current=page]{color:var(--navy);font-weight:700;box-shadow:inset 0 3px 0 var(--gold)}
@media (prefers-color-scheme:dark){nav button[aria-current=page]{color:#fff}}
#sheet{display:none}
#sheet.open{display:block}
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:10}
.panel{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));z-index:11}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111a30;color:#fff;border-radius:12px;padding:10px 14px;z-index:20;max-width:90%;text-align:center;display:none;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.item{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:var(--card)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:8px;align-items:center;min-height:44px}
.chk input{width:22px;height:22px}
.sr{position:absolute;left:-9999px}
.tools{display:flex;gap:8px;align-items:center;margin-top:10px}
.tools select{flex:1;min-width:0;min-height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;padding:0 8px;font:inherit;font-size:16px}
.tools select option{color:#111;background:#fff}
.gear{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font-size:1.2rem}
.loc{display:block;font-size:.72rem;font-weight:500;color:var(--muted);margin-top:2px}
.sess .when{margin:4px 0}
.sess .who{font-size:.88rem;color:var(--muted);margin:6px 0 10px;overflow-wrap:anywhere}
.sess.ended{opacity:.6}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
input[type=date],input[type=time],input[type=url],select.fld{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:48px}
.note{font-size:.8rem;color:var(--muted);margin:0 0 10px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <img src="icons/icon-192.png" alt="AGC Prayer Chain logo">
      <div class="t">
        <div class="cols"><div>AGC Prayer Chain</div><div lang="ne">AGC प्रार्थना शृङ्खला</div></div>
        <div class="sub" id="sub"></div>
      </div>
    </div>
    <div class="months" id="months"></div>
    <div class="tools">
      <span aria-hidden="true">🌍</span>
      <select id="tz" aria-label="Your time zone"></select>
      <button class="gear" id="gear" data-act="tab" data-v="admin" aria-label="Admin">⚙</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<nav id="tabs" aria-label="Main"></nav>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>

  togetherIntro: ['Join others at the same time, from anywhere in the world. Times are shown in your own time zone.', 'संसारको जुनसुकै ठाउँबाट अरूसँग एकै समयमा सहभागी हुनुहोस्। समय तपाईंको आफ्नै समय क्षेत्रमा देखाइन्छ।'],

async function load(quiet) {
  if (!quiet) { S.error = null; render(); }
  try {
    const d = await Api.state(S.month);
    S.data = d; S.tz = d.config.tz || S.tz; S.offline = false; S.error = null; S.updatedAt = Date.now();
    LS.set('agc_cache_' + S.month, d);
  } catch (e) {
    if (/not open/i.test(e.message || '') && !load.retrying) {
      // The month rolled over while the app stayed open: jump to the current month.
      load.retrying = true;
      try { S.month = startMonth(S.tz, chainOf(S.data && S.data.config)); S.day = null; S.draftMonth = null; S.sdraftMonth = null; S.data = null; return await load(quiet); }
      finally { load.retrying = false; }
    }
    const c = LS.get('agc_cache_' + S.month, null);
    if (c) { S.data = c; S.offline = true; } else { S.data = null; S.error = e.message || 'error'; }
  }
  S.now = tzNow(S.tz);
  { const cd = chainDates(S.month); if (!S.day || !cd.includes(S.day)) S.day = cd.includes(S.now.date) ? S.now.date : (cd[0] || `${S.month}-01`); }
  if (S.view === 'admin' && S.pin && S.data) { if (S.draftMonth !== S.month) startReqDraft(); if (S.sdraftMonth !== S.month) startSesDraft(); }
  const typing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (quiet && (typing || $('#sheet').classList.contains('open'))) return;
  render();
}

        <div><label class="f">${lab('fTime')}</label><input type="time" data-si="${i}" data-f="t" value="${esc(q.t)}"></div></div>
      <label class="f">${lab('fTitle')}</label>
      <div class="two"><input type="text" maxlength="120" placeholder="${esc(I.english[0])}" data-si="${i}" data-f="en" value="${esc(q.en)}">
        <input type="text" lang="ne" maxlength="120" placeholder="${esc(I.nepali[1])}" data-si="${i}" data-f="ne" value="${esc(q.ne)}"></div>
      <div class="two"><div><label class="f">${lab('fMinutes')}</label><select class="fld" data-si="${i}" data-f="dur">${durs.map((m) => `<option value="${m}" ${Number(q.dur) === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
        <div><label class="f">${lab('fLink')}</label><input type="url" inputmode="url" maxlength="300" data-si="${i}" data-f="link" value="${esc(q.link)}" placeholder="https://"></div></div>
      <div class="acts" style="margin-top:8px"><button class="btn ghost sm" data-act="trTitle" data-si="${i}">${bi('trDraft')}</button><button class="btn warn sm" data-act="delSes" data-si="${i}">${bi('del')}</button></div></div>`;
  });
  h += `<button class="btn ghost block" data-act="addSes">+ ${bi('addSession')}</button>
    <button class="btn gold block" style="margin-top:10px" data-act="saveSes">${bi('saveSessions')}</button>`;
  return h;
}

function adminHtml() {
  if (!S.pin) {
    return `<div class="card"><label class="f" for="pinIn">${esc(I.adminPin[0])} · <span lang="ne">${esc(I.adminPin[1])}</span></label>
      <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" aria-label="${esc(I.adminPin[0])}">
      <button class="btn block" style="margin-top:10px" data-act="unlock">${bi('unlock')}</button>
      ${isDemo() ? '<p class="muted">Demo PIN: 1234</p>' : ''}</div>`;
  }
  if (!S.draft || S.draftMonth !== S.month) startReqDraft();
  if (!S.sdraft || S.sdraftMonth !== S.month) startSesDraft();
  const [en, ne] = monthLabel(S.month);
  let html = cols(`<span class="h2">${esc(I.reqFor[0])}</span><div class="muted">${esc(en)}</div>`, `<span class="h2">${esc(I.reqFor[1])}</span><div class="muted">${esc(ne)}</div>`);
  html += `<p class="muted">${esc(I.adminHint[0])}<br><span lang="ne">${esc(I.adminHint[1])}</span></p>`;
  S.draft.forEach((q, i) => {
    html += `<div class="item"><div class="two">
        <div><label class="f">${esc(I.english[0])}</label><textarea data-i="${i}" data-f="en">${esc(q.en)}</textarea></div>
        <div><label class="f" lang="ne">${esc(I.nepali[1])}</label><textarea lang="ne" data-i="${i}" data-f="ne">${esc(q.ne)}</textarea></div></div>
      <div class="row2" style="margin-top:8px;flex-wrap:wrap">
        <label class="chk"><input type="checkbox" data-act="ans" data-i="${i}" ${q.status === 'answered' ? 'checked' : ''}> ${bi('markAns')}</label>
        <div class="acts">
          <button class="btn ghost sm" data-act="trAdmin" data-i="${i}">${bi('trDraft')}</button>
          <button class="btn ghost sm" data-act="up" data-i="${i}" aria-label="${esc(I.moveUp[0])}">↑</button>
          <button class="btn ghost sm" data-act="down" data-i="${i}" aria-label="${esc(I.moveDown[0])}">↓</button>
          <button class="btn warn sm" data-act="del" data-i="${i}">${bi('del')}</button>
        </div></div></div>`;
  });
  html += `<button class="btn ghost block" data-act="addReq">+ ${bi('addReq')}</button>
    <button class="btn gold block" style="margin-top:10px" data-act="saveReq">${bi('saveReq')}</button>`;
  html += sessionsEditorHtml();
  html += `<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
    <label class="f" for="rmIn">${esc(I.rmName[0])} · <span lang="ne">${esc(I.rmName[1])}</span></label>
    <div class="two"><input id="rmIn" type="text" maxlength="40" autocomplete="off"><button class="btn warn" data-act="rmName">${bi('rmBtn')}</button></div>
    <button class="btn ghost block" style="margin-top:14px" data-act="archive">${bi('archive')}</button>
    <button class="btn ghost block" style="margin-top:10px" data-act="lock">${bi('lock')}</button>`;
  return html;
}

function render() {
  headerParts();
  let html = bannerHtml();
  if (S.error && !S.data) {
    html += `<div class="empty">${esc(I.tryAgain[0])}<br><span lang="ne">${esc(I.tryAgain[1])}</span><br><br><button class="btn" data-act="retry">${bi('retry')}</button></div>`;
  } else if (!S.data) {
    html += `<div class="empty">${esc(I.loading[0])} · <span lang="ne">${esc(I.loading[1])}</span></div>`;
  } else {
    html += ({ slots: slotsHtml, together: togetherHtml, requests: requestsHtml, mine: mineHtml, translate: translateHtml, admin: adminHtml }[S.view] || slotsHtml)();
  }
  const sy = window.scrollY;
  $('#main').innerHTML = html;
  $('#tabs').innerHTML = tabsHtml();
  const strip = $('#strip');
  if (strip) { const b = strip.querySelector('[aria-pressed="true"]'); if (b) strip.scrollLeft = b.offsetLeft - strip.clientWidth / 2 + b.clientWidth / 2; }
  if (S.flashHour != null) {
    const row = document.querySelector(`.slot[data-hour="${S.flashHour}"]`);
    if (row) row.scrollIntoView({ block: 'center' });
    S.flashHour = null;
  } else window.scrollTo(0, sy);
}

/* ====================================================================
   ACTIONS
   ==================================================================== */
function openSheet(html) { $('#sheet').innerHTML = `<div class="scrim" data-act="closeSheet"></div><div class="panel">${html}</div>`; $('#sheet').classList.add('open'); }
function closeSheet() { $('#sheet').classList.remove('open'); $('#sheet').innerHTML = ''; }

async function run(fn) {
  if (S.busy) return; S.busy = true;
  try { await fn(); } catch (e) {
    if (e.message === 'taken') { closeSheet(); toast('taken'); }
    else if (/admin PIN/i.test(e.message)) { toast('wrongPin'); S.pin = ''; try { sessionStorage.removeItem('agc_pin'); } catch (x) {} render(); }
    else { if (!/first name/i.test(e.message || '')) closeSheet(); toast(null, e.message || 'Error'); }
    await load(true);
  } finally { S.busy = false; }
}
const post = (b) => Api.post(Object.assign({ month: S.month }, b));

async function translateInto(text, from, to, done) {
  if (S.busy) return; S.busy = true; toast('translating');
  try {
    const r = await Api.post({ action: 'translate', text, from, to, pin: S.pin || undefined });
    done(r.text);
  } catch (e) {
    if (e.message === 'DEMO_NO_TRANSLATE') toast('trDemo'); else toast(null, e.message || 'Error');
  } finally { S.busy = false; }
}

async function onAct(act, el, ev) {
  const d = el.dataset.d, h = Number(el.dataset.h), i = Number(el.dataset.i);
  switch (act) {
    case 'tab': S.view = el.dataset.v; if (S.view === 'admin' && S.pin && S.data) { if (S.draftMonth !== S.month) startReqDraft(); if (S.sdraftMonth !== S.month) startSesDraft(); } render(); window.scrollTo(0, 0); break;
    case 'month': S.month = el.dataset.m; S.day = null; S.draftMonth = null; S.sdraftMonth = null; S.data = null; await load(); break;
    case 'day': S.day = d; render(); break;
    case 'retry': await load(); break;
    case 'refresh': if (!S.busy) { S.busy = true; try { await load(true); } finally { S.busy = false; } render(); } break;
    case 'dismissIos': LS.set('agc_ios_dismissed', true); render(); break;
    case 'install': if (S.installEvt) { S.installEvt.prompt(); S.installEvt = null; render(); } break;
    case 'closeSheet': closeSheet(); break;
    case 'nextOpen': {
      const idx = slotIndex();
      for (const date of chainDates(S.month)) for (const hh of hoursList()) {
        if (isPast(date, hh) || idx.has(`${date}|${hh}`)) continue;
        S.day = date; S.flashHour = hh; render(); return;
      }
      toast('allCovered'); break;
    }
    case 'pick': {
      const dl = dayLabel(d), nm = LS.get('agc_name', '');
      openSheet(`<div class="h2">${esc(I.confirmQ[0])}</div><div lang="ne" class="muted">${esc(I.confirmQ[1])}</div>
        <p><b>${esc(range(h))}</b><br>${esc(dl[0])}<br><span lang="ne">${esc(dl[1])}</span></p>
        <label class="f" for="nameIn">${esc(I.firstName[0])} · <span lang="ne">${esc(I.firstName[1])}</span></label>
        <input id="nameIn" type="text" maxlength="40" autocomplete="given-name" value="${esc(nm)}">
        <p class="muted">${esc(I.firstOnly[0])} <span lang="ne">${esc(I.firstOnly[1])}</span></p>
        <div class="two"><button class="btn ghost" data-act="closeSheet">${bi('close')}</button>
        <button class="btn gold" data-act="confirmPick" data-d="${d}" data-h="${h}">${bi('confirm')}</button></div>`);
      setTimeout(() => { const n = $('#nameIn'); if (n && !n.value) n.focus(); }, 60);
      break;
    }
    case 'confirmPick': {
      const name = firstName($('#nameIn') ? $('#nameIn').value : '');
      if (!name) { toast('nameNeeded'); return; }
      LS.set('agc_name', name);
      await run(async () => { await post({ action: 'claim', date: d, hour: h, name }); closeSheet(); toast('picked'); await load(true); });
      break;
    }
    case 'cancel': await run(async () => { await post({ action: 'release', date: d, hour: h }); toast('released'); await load(true); }); break;
    case 'remove': await run(async () => { await post({ action: 'release', date: d, hour: h, pin: S.pin }); await load(true); }); break;
    case 'prayed': await run(async () => { await post({ action: 'prayed', date: d, hour: h }); await load(true); }); break;
    case 'cal': downloadIcs(d, h, S.tz); break;
    case 'copyCode': {
      try { await navigator.clipboard.writeText(deviceId); toast('copied'); }
      catch (e) { const o = $('#myCode'); if (o && window.getSelection) { const r = document.createRange(); r.selectNodeContents(o); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); } }
      break;
    }
    case 'restore': {
      const code = (($('#restoreIn') || {}).value || '').trim();
      if (!/^[A-Za-z0-9-]{16,64}$/.test(code)) { toast('restoreBad'); return; }
      LS.set('agc_device', code); location.reload(); break;
    }
    case 'rmName': {
      const name = firstName(($('#rmIn') || {}).value || ''); if (!name) { toast('nameNeeded'); return; }
      await run(async () => { const r = await post({ action: 'removeName', name, pin: S.pin }); toast(null, I.rmDone[0] + ' · ' + I.rmDone[1] + ': ' + (r.removed || 0)); await load(true); });
      break;
    }
    case 'unlock': {
      const pin = ($('#pinIn') || {}).value || '';
      await run(async () => { await post({ action: 'checkPin', pin }); S.pin = pin; try { sessionStorage.setItem('agc_pin', pin); } catch (x) {} startDraft(); render(); });
      break;
    }
    case 'lock': S.pin = ''; try { sessionStorage.removeItem('agc_pin'); } catch (x) {} S.draft = null; S.draftMonth = null; S.sdraft = null; S.sdraftMonth = null; render(); break;
    case 'addReq': S.draft.push({ en: '', ne: '', status: 'active' }); render(); break;
    case 'del': S.draft.splice(i, 1); render(); break;
    case 'up': if (i > 0) { [S.draft[i - 1], S.draft[i]] = [S.draft[i], S.draft[i - 1]]; render(); } break;
    case 'down': if (i < S.draft.length - 1) { [S.draft[i + 1], S.draft[i]] = [S.draft[i], S.draft[i + 1]]; render(); } break;
    case 'saveReq': await run(async () => { await post({ action: 'saveRequests', pin: S.pin, requests: S.draft }); toast('saved'); S.draftMonth = null; await load(true); startReqDraft(); }); break;
    case 'joinPick': {
      const q = S.data.sessions.find((x) => x.id === el.dataset.sid); if (!q) return;
      const t = sessionTimes(q);
      openSheet(`<div class="h2">${esc(I.joinQ[0])}</div><div lang="ne" class="muted">${esc(I.joinQ[1])}</div>
        <p><b>${esc(q.en || q.ne)}</b><br>${esc(t.chain)}${t.local ? `<br>🌍 ${esc(t.local)}` : ''}</p>
        <label class="f" for="nameIn">${esc(I.firstName[0])} · <span lang="ne">${esc(I.firstName[1])}</span></label>
        <input id="nameIn" type="text" maxlength="40" autocomplete="given-name" value="${esc(LS.get('agc_name', ''))}">
        <label class="f" for="placeIn">${esc(I.placeQ[0])} · <span lang="ne">${esc(I.placeQ[1])}</span></label>
        <input id="placeIn" type="text" maxlength="40" value="${esc(LS.get('agc_place', ''))}">
        <p class="muted">${esc(I.firstOnly[0])} <span lang="ne">${esc(I.firstOnly[1])}</span></p>
        <div class="two"><button class="btn ghost" data-act="closeSheet">${bi('close')}</button>
        <button class="btn gold" data-act="confirmJoin" data-sid="${esc(q.id)}">${bi('confirm')}</button></div>`);
      break;
    }
    case 'confirmJoin': {
      const name = firstName($('#nameIn') ? $('#nameIn').value : ''), place = ($('#placeIn') ? $('#placeIn').value : '').trim();
      if (!name) { toast('nameNeeded'); return; }
      LS.set('agc_name', name); LS.set('agc_place', place);
      await run(async () => { await post({ action: 'join', sessionId: el.dataset.sid, name, country: place }); closeSheet(); toast('sessionJoined'); await load(true); });
      break;
    }
    case 'leaveSes': await run(async () => { await post({ action: 'leave', sessionId: el.dataset.sid }); toast('sessionLeft'); await load(true); }); break;
    case 'calSes': {
      const q = S.data.sessions.find((x) => x.id === el.dataset.sid); if (!q) return;
      const t = sessionTimes(q), link = safeLink(q.link);
      downloadText(`prayer-group-${q.d}.ics`, icsEvent(t.start, t.end, `${q.en || q.ne} | AGC प्रार्थना शृङ्खला`, `agc-s-${q.id}@prayerchain`, `Group prayer.${link ? ' Join: ' + link : ''}`));
      break;
    }
    case 'trDir': S.tr.dir = el.dataset.v; S.tr.output = ''; render(); break;
    case 'trGo': {
      const text = (S.tr.input || '').trim(); if (!text) { toast('trEmpty'); return; }
      const [from, to] = S.tr.dir.split('-');
      await translateInto(text, from, to, (out) => { S.tr.output = out; $('#toast').style.display = 'none'; render(); });
      break;
    }
    case 'trCopy': {
      try { await navigator.clipboard.writeText(S.tr.output); toast('copied'); }
      catch (e) { const o = $('#trOut'); if (o && window.getSelection) { const r = document.createRange(); r.selectNodeContents(o); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); } }
      break;
    }
    case 'trAdmin': {
      const q = S.draft[i]; if (!q || !q.en.trim()) { toast('trEmpty'); return; }
      await translateInto(q.en, 'en', 'ne', (out) => { q.ne = out; render(); toast('trDraftNote'); });
      break;
    }
    case 'trTitle': {
      const q = S.sdraft[Number(el.dataset.si)]; if (!q || !q.en.trim()) { toast('trEmpty'); return; }
      await translateInto(q.en, 'en', 'ne', (out) => { q.ne = out; render(); toast('trDraftNote'); });
      break;
    }
    case 'addSes': S.sdraft.push({ id: '', d: (() => { const cd = chainDates(S.month); return cd.includes(S.now.date) ? S.now.date : (cd[0] || `${S.month}-01`); })(), t: '20:00', dur: 60, en: '', ne: '', link: '' }); render(); break;
    case 'delSes': S.sdraft.splice(Number(el.dataset.si), 1); render(); break;
    case 'saveSes': await run(async () => { await post({ action: 'saveSessions', pin: S.pin, sessions: S.sdraft }); toast('saved'); S.sdraftMonth = null; await load(true); startSesDraft(); }); break;
    case 'archive': {
      if (!confirm(I.confirmArch[0] + '\n' + I.confirmArch[1])) return;
      const prev = (() => { let [y, m] = curMonth().split('-').map(Number); m--; if (m < 1) { m = 12; y--; } return `${y}-${pad(m)}`; })();
      await run(async () => { const r = await Api.post({ action: 'archive', month: prev, pin: S.pin }); toast(null, r.archived ? I.archived[0] + ' · ' + I.archived[1] : (r.note || 'Nothing to archive')); });
      break;
    }
  }
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.type === 'checkbox') return;
  onAct(el.dataset.act, el, ev);
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.matches && el.matches('input[data-act="ans"]')) { S.draft[Number(el.dataset.i)].status = el.checked ? 'answered' : 'active'; }
  if (el.id === 'tz') { S.vtz = validTz(el.value) || S.vtz; LS.set('agc_vtz', S.vtz); render(); }
  if (el.matches && el.matches('select[data-si]')) { S.sdraft[Number(el.dataset.si)].dur = Number(el.value); }
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.matches && el.matches('textarea[data-i]')) { S.draft[Number(el.dataset.i)][el.dataset.f] = el.value; }
  if (el.matches && el.matches('input[data-si]')) { S.sdraft[Number(el.dataset.si)][el.dataset.f] = el.value; }
  if (el.id === 'trIn') { S.tr.input = el.value; }
});
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(true); });
setInterval(() => { if (document.visibilityState === 'visible' && !S.busy) load(true); }, 20000);   // keeps everyone's view current; the server's 20-second copy keeps this light
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

render();
load();
</script>
</body>
</html>
