<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#27407a"/>
      <stop offset="1" stop-color="#0f1b38"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#b8841f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- ring of 12 linked chain circles -->
  <g fill="none" stroke="url(#gold)" stroke-width="12">
    <circle cx="256" cy="86" r="34"/>
    <circle cx="341" cy="108.8" r="34"/>
    <circle cx="403.2" cy="171" r="34"/>
    <circle cx="426" cy="256" r="34"/>
    <circle cx="403.2" cy="341" r="34"/>
    <circle cx="341" cy="403.2" r="34"/>
    <circle cx="256" cy="426" r="34"/>
    <circle cx="171" cy="403.2" r="34"/>
    <circle cx="108.8" cy="341" r="34"/>
    <circle cx="86" cy="256" r="34"/>
    <circle cx="108.8" cy="171" r="34"/>
    <circle cx="171" cy="108.8" r="34"/>
  </g>
  <!-- glow behind the cross -->
  <circle cx="256" cy="256" r="104" fill="#ffffff" opacity="0.07"/>
  <!-- cross -->
  <g fill="url(#gold)">
    <rect x="232" y="162" width="48" height="196" rx="8"/>
    <rect x="186" y="208" width="140" height="48" rx="8"/>
  </g>
  <!-- rays of light -->
  <g stroke="#f3d27a" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="132" x2="256" y2="146"/>
    <line x1="214" y1="143" x2="221" y2="155"/>
    <line x1="298" y1="143" x2="291" y2="155"/>
  </g>
</svg>
